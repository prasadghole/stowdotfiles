# ============================================================
#  .tmux.conf  —  WSL / tmux 3.4  |  Nord Theme
# ============================================================

# Nord palette
# bg:       #2e3440  (polar night darkest)
# bg2:      #3b4252  (polar night)
# bg3:      #434c5e  (polar night lighter)
# fg:       #d8dee9  (snow storm)
# fg2:      #e5e9f0
# accent:   #88c0d0  (frost cyan)
# blue:     #81a1c1  (frost blue)
# green:    #a3be8c  (aurora green)
# yellow:   #ebcb8b  (aurora yellow)
# red:      #bf616a  (aurora red)


# -----------------------------------------------------------
# Prefix  (C-a instead of C-b)
# -----------------------------------------------------------
set  -g prefix C-a
unbind C-b
unbind C-a
bind-key C-a send-prefix          # C-a C-a sends literal C-a


# -----------------------------------------------------------
# General
# -----------------------------------------------------------
set  -g default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:Tc"   # true-color in WSL
set  -ga terminal-overrides ",xterm-256color:RGB"  # fallback RGB

set  -g base-index 1              # windows start at 1
setw -g pane-base-index 1         # panes too
set  -g renumber-windows on       # re-number after closing

set  -g history-limit 20000       # large scrollback
set  -g escape-time 0             # no ESC delay (critical for nvim)
set  -g focus-events on           # pass focus events to apps (nvim, etc.)
set  -g mouse on                  # click panes, scroll, resize

setw -g automatic-rename on       # rename window to running command
set  -g display-time 1500         # message display duration (ms)
set  -g status-interval 5         # refresh status every 5s

# WSL: prevent bell noise
set  -g bell-action none
set  -g visual-bell off
set  -g visual-activity off


# -----------------------------------------------------------
# Key bindings
# -----------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display " Config reloaded!"

# Split panes (stay in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind \"
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (repeatable with prefix held)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -r n next-window
bind -r p previous-window

# Kill pane/window without confirm prompt
bind x kill-pane
bind X kill-window

# Toggle zoom (fullscreen pane)
bind z resize-pane -Z


# -----------------------------------------------------------
# Copy mode  (vi keys + WSL clipboard)
# -----------------------------------------------------------
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# y → copy to Windows clipboard via clip.exe (always available in WSL)
bind -T copy-mode-vi y \
  send -X copy-pipe-and-cancel "clip.exe"

# Middle-click paste from Windows clipboard
bind -T root MouseDown2Pane run -b \
  "powershell.exe -command Get-Clipboard | clip.exe ; tmux paste-buffer"


# -----------------------------------------------------------
# Nord Status Bar
# -----------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-interval 5

# Background / foreground
set -g status-style "bg=#3b4252,fg=#d8dee9"

# Left: session name block
set -g status-left \
  "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#3b4252,fg=#88c0d0]#[default] "

# Right: WSL distro + time + date
set -g status-right \
  "#[fg=#81a1c1] %H:%M #[fg=#d8dee9]· #[fg=#a3be8c]%d %b %Y "

set -g status-left-length  30
set -g status-right-length 50

# Inactive windows
setw -g window-status-style         "fg=#81a1c1,bg=#3b4252"
setw -g window-status-format        " #I:#W "

# Active window
setw -g window-status-current-style "fg=#2e3440,bg=#88c0d0,bold"
setw -g window-status-current-format " #I:#W "

# Window activity
setw -g window-status-activity-style "fg=#ebcb8b,bg=#3b4252"


# -----------------------------------------------------------
# Nord Pane borders
# -----------------------------------------------------------
set -g pane-border-style        "fg=#434c5e"
set -g pane-active-border-style "fg=#88c0d0"

# Show pane numbers longer
set -g display-panes-time 2000
set -g display-panes-colour        "#434c5e"
set -g display-panes-active-colour "#88c0d0"


# -----------------------------------------------------------
# Nord Messages & Copy mode highlight
# -----------------------------------------------------------
set -g message-style        "bg=#434c5e,fg=#ebcb8b,bold"
set -g message-command-style "bg=#434c5e,fg=#d8dee9"

setw -g mode-style "bg=#4c566a,fg=#88c0d0"
